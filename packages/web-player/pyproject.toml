[project]
name = "web-player"
version = "0.1.0"
description = "Play slither.io from Python through a Playwright-controlled browser"
readme = "README.md"
authors = [
    { name = "eligrubbs", email = "gitcontribs@eligrubbs.com" }
]
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.64.0",
]

[project.scripts]
web-player = "web_player.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
