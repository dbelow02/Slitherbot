[project]
name = "datacollection"
version = "0.1.0"
description = "Records slither.io game state for training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "playwright>=1.64.0",
]

[project.scripts]
datacollection = "datacollection:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
